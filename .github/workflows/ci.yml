name: CI

# Roda em toda PR contra main e em todo push direto a main.
#
# Os dois jobs rodam EM PARALELO (Fase 10). Antes, "e2e" tinha
# `needs: verify` para economizar minutos quando tipos/lint/testes/build
# já haviam falhado — mas isso somava os dois tempos no relógio de parede
# (3m30 + 14m30 = 18m20), estourando o teto operacional de 18 minutos do
# run inteiro.
#
# A paralelização é segura porque os jobs NÃO compartilham nada: cada um
# tem o seu próprio container de Postgres (bloco `services` em ambos), o
# seu próprio checkout, o seu próprio `npm ci`, e roda `prepare-test-db` +
# `seed-e2e` no próprio banco. "e2e" não consome nenhum artefato de
# "verify" — a dependência era só de custo, nunca técnica.
#
# O que se perde: numa PR que quebra o build, os minutos do Playwright
# passam a ser gastos mesmo assim. O que se ganha: o run inteiro cabe no
# teto, que é requisito operacional. A proteção real contra código
# quebrado em main continua sendo branch protection exigindo os dois
# checks (ver README, seção CI/CD).
#
# ---------------------------------------------------------------------
# SHARDING DO E2E — mesmo princípio, um nível abaixo
# ---------------------------------------------------------------------
# A suíte E2E cresceu de 476 para 566 testes e o job passou a consumir
# 716s de um run de 719s: medido por passo, 611s eram os TESTES e ~103s
# todo o preparo (containers 12s, npm ci 27s, build 46s, banco 2s, seed
# 4s, resto ~12s). O `verify` roda em 281s em paralelo e não influencia o
# relógio.
#
# A suíte roda com workers:1 e fullyParallel:false — decisão consciente,
# porque os specs compartilham um servidor Next, um Postgres e um seed de
# IDs fixos, e já houve contaminação real de fixture. Subir `workers`
# atacaria justamente essa premissa.
#
# O sharding não ataca: cada shard é um JOB, e um job do GitHub Actions
# tem o seu próprio container de Postgres, o seu próprio checkout, o seu
# próprio build e o seu próprio seed. Não é paralelismo por esperança, é
# paralelismo por isolamento — exatamente o mesmo argumento que já
# permite `verify` e `e2e` correrem juntos.
#
# Medido localmente, cada shard contra um banco recém-semeado:
#   shard 1/2 -> 284 testes, 205s / 208s / 205s (três execuções)
#   shard 2/2 -> 282 testes, 165s / 164s
# A soma (370s) é a mesma da suíte inteira (372s): nenhum teste foi
# removido nem duplicado. O que muda é o relógio, que passa a ser o
# shard mais longo.
#
# Nenhum spec é dividido entre shards (verificado com `--list`), então a
# ordem interna de cada arquivo continua idêntica.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Permissão mínima: nenhum job deste workflow escreve no repositório,
# comenta em PR ou publica artefato que precise de escopo além de leitura
# do código. actions/upload-artifact não exige permissão extra.
permissions:
  contents: read

# Cancela uma rodada anterior do mesmo PR/branch quando um novo push chega
# — evita gastar minutos de CI validando um commit que já foi substituído.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Credenciais fixas do Postgres efêmero do job — não são segredo (mesmo
  # padrão do docker-compose.yml local), só precisam bater com o service
  # container abaixo e com .env.test (que os testes carregam sozinhos).
  POSTGRES_USER: imoveis
  POSTGRES_PASSWORD: imoveis
  POSTGRES_DB: imoveis_test

jobs:
  verify:
    name: Verificação (tipos, lint, testes, build)
    runs-on: ubuntu-latest
    # Containment do JOB inteiro, incluindo setup — camada diferente do
    # globalTimeout de 16 min do Playwright, que só cobre a execução dos
    # testes. Alinhado ao teto operacional de 18 min do run: um job
    # travado morre dentro do orçamento em vez de rodar até o padrão de
    # 6 horas do GitHub. NÃO substitui monitoramento; é a última linha.
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        # O runner só passa os steps seguintes pro Postgres depois que o
        # healthcheck ficar "healthy" — não precisa de polling manual.
        options: >-
          --health-cmd "pg_isready -U imoveis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        # npm ci já roda isso via postinstall — mantido explícito porque
        # foi pedido como passo próprio e serve de salvaguarda caso o
        # postinstall seja removido do package.json no futuro.
        run: npx prisma generate

      - name: Checar tipos (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Checar se a migration mais recente tem operação destrutiva (informativo)
        # Nunca falha o job — só anota no resumo do run (ver
        # scripts/check-latest-migration.ts e
        # docs/operations/rollback-runbook.md, seção 2). A decisão de
        # prosseguir com uma migration destrutiva legítima é de quem
        # revisa o PR, não deste passo.
        run: npx tsx scripts/check-latest-migration.ts

      - name: Preparar banco de teste (cria se preciso + aplica migrations)
        run: npx tsx scripts/prepare-test-db.ts

      - name: Seed mínimo do banco de teste
        run: npx tsx prisma/seed-e2e.ts

      - name: Testes (unitários + integração)
        run: npm run test

      - name: Build de produção
        run: npm run build
        env:
          # NODE_ENV=test só pra este passo: faz o `next build` carregar
          # .env.test (valores fixos, sem segredo real) em vez de exigir
          # segredo de produção — o objetivo aqui é só detectar erro de
          # build antes do merge, não gerar o artefato que vai pro
          # deploy (a DigitalOcean faz seu próprio build a partir do
          # source — ver README, seção CI/CD).
          NODE_ENV: test

    # O Postgres efêmero deste job é destruído automaticamente pelo runner
    # ao final (container de "services" não sobrevive além do job) — não
    # precisa de um passo de teardown manual.

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    # 18 min continua sendo o teto de CADA shard — nenhum deles deve
    # chegar perto (o mais longo mediu ~7 min de job no CI).
    timeout-minutes: 18
    strategy:
      # fail-fast desligado de propósito: quando um shard quebra, quero o
      # resultado do outro no mesmo run em vez de um cancelamento que
      # esconde se a falha era local àquele recorte.
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imoveis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      # Versão do Playwright e imagem do runner, no mesmo passo — as duas
      # compõem a chave de cache abaixo. `ImageOS` (ex: "ubuntu24") é uma
      # variável de ambiente do runner e precisa ser lida pelo shell:
      # `${{ env.ImageOS }}` numa expressão resolve para vazio, o que foi
      # observado no run 34147492559 (chave saiu como
      # "playwright-browser-Linux--X64-1.62.1", com o campo em branco).
      # `${ImageOS:-desconhecido}` mantém a chave bem formada caso a
      # variável deixe de existir.
      - name: Descobrir versão do Playwright e imagem do runner
        id: ambiente
        run: |
          echo "playwright=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "imagem=${ImageOS:-desconhecido}" >> "$GITHUB_OUTPUT"

      # Guarda só o BINÁRIO do browser (~/.cache/ms-playwright), ~430 MB.
      #
      # A chave combina imagem do runner + arquitetura + versão do
      # Playwright. A imagem entra porque um binário baixado para
      # ubuntu24 não deve ser reaproveitado em silêncio quando o GitHub
      # promover ubuntu-latest para a próxima LTS; ela já carrega o SO,
      # então `runner.os` seria redundante. A versão do Playwright entra
      # porque é ela que determina a revisão do browser.
      #
      # SEM restore-keys de propósito. Uma chave parcial devolveria o
      # cache de outra versão do Playwright, que não contém a revisão
      # desta — o passo seguinte teria de baixar assim mesmo, e o cache
      # ficaria acumulando revisões velhas.
      #
      # O miss é barato e foi medido no run 34147492559: 11 segundos para
      # baixar Chrome for Testing + headless shell + ffmpeg do CDN do
      # Playwright. Cache indisponível degrada o tempo, nunca a
      # correção.
      - name: Cache do browser do Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-${{ steps.ambiente.outputs.imagem }}-${{ runner.arch }}-${{ steps.ambiente.outputs.playwright }}

      # FASE 20 — sem `--with-deps`, e sem um passo de `install-deps` no
      # caminho de cache hit.
      #
      # POR QUÊ, com evidência do run 34144643868 (Fase 19), onde este
      # passo consumiu 8m14s de um job de 16m25s: o log mostra TODAS as
      # bibliotecas da lista `chromium` do Playwright (libnss3, libgbm1,
      # libxkbcommon0, libcups2t64, xvfb, fonts-liberation, ...) como
      # "already the newest version". O runner ubuntu-24.04 já as traz.
      #
      # Os únicos 9 pacotes realmente NOVOS vinham da lista `tools` do
      # Playwright (ver nativeDeps em playwright-core) e eram todos
      # fontes de scripts não-latinos e utilitários X11 legados:
      # fonts-ipafont-gothic (japonês), fonts-wqy-zenhei (chinês),
      # fonts-tlwg-loma-otf (tailandês), fonts-unifont, xfonts-cyrillic,
      # xfonts-encodings, xfonts-scalable, xfonts-utils,
      # fonts-freefont-ttf. A suíte é um produto em português testado só
      # em Chromium; nenhum teste renderiza esses scripts.
      #
      # E o custo não era o tamanho (21,1 MB) e sim a VARIÂNCIA do mirror
      # do Ubuntu: no MESMO passo, o `apt-get update` puxou 11,8 MB a
      # 8154 kB/s e logo depois esses 21,1 MB levaram 8 minutos (~44
      # kB/s). Enquanto o apt estiver no caminho crítico, o orçamento de
      # 18 minutos depende de um mirror que não controlamos.
      #
      # Fontes latinas (fonts-liberation, DejaVu), fonts-noto-color-emoji,
      # libfontconfig1 e libfreetype6 continuam presentes no runner — são
      # elas que renderizam o produto.
      - name: Instalar browser do Playwright (só no cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Rede de segurança para a única premissa desta mudança: a de que o
      # runner continua trazendo as bibliotecas do Chromium. Se o GitHub
      # mudar a imagem e remover alguma, isto falha aqui em ~3 segundos,
      # com um nome de passo e uma mensagem que dizem exatamente o que
      # fazer — em vez de 402 testes falharem seis minutos depois com
      # "browser closed unexpectedly", que parece bug de produto.
      #
      # Testa a CAPACIDADE (o browser inicia), não a lista de pacotes:
      # `install-deps --dry-run` sairia com código != 0 por causa das
      # fontes acima, que são justamente o que não queremos instalar.
      - name: Verificar que o Chromium inicia sem dependências extras
        run: |
          node -e "
          const { chromium } = require('@playwright/test');
          chromium.launch().then(b => b.close()).then(
            () => console.log('Chromium iniciou: as libs do runner bastam.'),
            (erro) => {
              console.error('FALHA: o Chromium não iniciou neste runner.');
              console.error('A imagem do runner provavelmente deixou de trazer alguma lib do Chromium.');
              console.error('Correção: voltar este passo para \'npx playwright install --with-deps chromium\'.');
              console.error(String(erro));
              process.exit(1);
            }
          );
          "

      - name: Preparar banco de teste (cria se preciso + aplica migrations)
        run: npx tsx scripts/prepare-test-db.ts

      - name: Seed mínimo do banco de teste
        run: npx tsx prisma/seed-e2e.ts

      # Fase 12 — a suíte passa a rodar contra o servidor de PRODUÇÃO no
      # CI, não contra `next dev`. Causa raiz medida no run 34070254274:
      # o `next dev` reiniciou 3 vezes por memória ("Server is
      # approaching the used memory threshold, restarting..."), matando
      # navegações em voo com ERR_CONNECTION_RESET/REFUSED; os retries
      # somaram minutos e a suíte bateu no globalTimeout com 12 testes
      # sem rodar. Quem consome essa memória é o COMPILADOR, que só
      # existe em modo dev — `next start` serve o build já pronto e não
      # tem esse crescimento.
      #
      # Não é máscara: nenhum timeout de teste, retry ou assertion mudou.
      # É a remoção da causa. Local continua em `next dev`, onde o
      # feedback rápido importa mais que a estabilidade de 358 testes
      # seguidos (ver playwright.config.ts).
      # NODE_ENV=test não é detalhe: é o que faz o Next carregar
      # .env.test no BUILD. PUBLIC_ORG_SLUG é lido em build time pelos
      # rewrites de next.config.ts (`/` -> `/{slug}`), então um build
      # feito com o env errado serve 404 na home e derruba
      # site-publico.spec.ts inteiro — reproduzido localmente antes de
      # subir.
      - name: Build de produção (servidor da suíte E2E)
        run: npm run build
        env:
          NODE_ENV: test

      - name: "Testes E2E (fluxos críticos: login, CRUD de imóvel, isolamento de tenant, bloqueio de módulo, formulário público, mobile)"
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

      - name: Anexar relatório do Playwright (só quando falha)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Nome por shard: dois legs subindo o mesmo nome colidem e o
          # segundo upload falha, escondendo o relatório justo quando ele
          # é necessário.
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Nome e id estáveis, de propósito: a proteção de branch exige o check
  # "E2E (Playwright)" (ver README, seção CI/CD), e uma matriz publica um
  # check por leg ("E2E shard 1/2"). Sem este agregador, renomear o job
  # faria a proteção passar a exigir um check que não existe mais — que é
  # como uma suíte inteira deixa de bloquear merge sem ninguém perceber.
  #
  # `if: always()` com checagem explícita do resultado: sem isso, um
  # shard cancelado ou pulado deixaria este job verde por omissão. O
  # resultado de um job de matriz só é "success" quando TODOS os legs
  # passaram.
  e2e:
    name: E2E (Playwright)
    needs: [e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consolidar resultado dos shards
        run: |
          resultado="${{ needs.e2e-shard.result }}"
          if [ "$resultado" != "success" ]; then
            echo "E2E reprovado — resultado agregado dos shards: $resultado"
            echo "Veja os checks \"E2E shard 1/2\" e \"E2E shard 2/2\" para qual falhou."
            exit 1
          fi
          echo "Todos os shards do E2E passaram."
